name: Release gate

on:
  push:
    tags:
      - "v*"

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run Ruff
        run: ruff check .

      - name: Run tests
        run: pytest tests/ -q

      - name: Run benchmark
        run: python benchmark/run_benchmark.py

      - name: Validate rule inventory
        run: |
          python -c "
          import pyrift, re
          from pathlib import Path
          rules = pyrift.ALL_RULES
          readme = Path('README.md').read_text()
          count = len(rules)
          assert str(count) in readme, f'README does not mention rule count {count}'
          version = pyrift.__version__
          assert version in readme, f'README does not mention version {version}'
          print(f'Rule inventory valid: {count} rules, v{version}')
          "

      - name: Check CHANGELOG updated
        run: |
          python -c "
          import pyrift
          from pathlib import Path
          version = pyrift.__version__
          changelog = Path('CHANGELOG.md').read_text()
          assert version in changelog, f'CHANGELOG missing entry for v{version}'
          print(f'CHANGELOG has entry for v{version}')
          "

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: \${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist/

      - name: Build
        run: python -m build