name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test / ${{ matrix.os }} / CPython ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        exclude:
          - os: windows-latest
            python-version: "3.10"
          - os: macos-latest
            python-version: "3.11"
        include:
          - os: ubuntu-latest
            python-version: "3.15"
            experimental: true
    continue-on-error: ${{ matrix.experimental == true }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: ${{ matrix.experimental == true }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            benchmark/requirements.txt

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Check lint
        run: python -m ruff check .

      - name: Type check
        run: python -m mypy pyrift --ignore-missing-imports

      - name: Compile project
        run: python -m compileall -q pyrift tests benchmark scripts

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Enforce coverage threshold
        run: python -m pytest tests/ -q --cov=pyrift --cov-report=term --cov-fail-under=95

      - name: Check documentation statistics
        run: python scripts/check_docs.py

      - name: Run golden benchmark
        run: python benchmark/run_benchmark.py

      - name: Self-scan quality gate
        run: python benchmark/self_scan.py

      - name: Runtime differential harness
        run: python benchmark/runtime_harness.py

      - name: Rule-robustness fuzz harness
        run: python benchmark/fuzz_harness.py

  corpus:
    name: Corpus benchmark / Python 3.12
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            benchmark/requirements.txt

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Install pinned corpus dependencies
        run: python -m pip install -r benchmark/requirements.txt

      - name: Run strict corpus benchmark
        env:
          PYRIFT_CORPUS_STRICT: "1"
        run: python benchmark/corpus.py

  pypy:
    name: Test / PyPy 3.11
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up PyPy
        uses: actions/setup-python@v5
        with:
          python-version: "pypy3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            benchmark/requirements.txt

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Check lint
        run: python -m ruff check .

      - name: Compile project
        run: python -m compileall -q pyrift tests benchmark scripts

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Check documentation statistics
        run: python scripts/check_docs.py

      - name: Run golden benchmark
        run: python benchmark/run_benchmark.py

      - name: Self-scan quality gate
        run: python benchmark/self_scan.py