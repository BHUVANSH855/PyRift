name: Verify rules

on:
  push:
    branches: ["main"]
    paths:
      - "pyrift/rules/**"
      - "pyrift/rule_metadata.py"
      - "tools/verify_rule.py"
  pull_request:
    branches: ["main"]
    paths:
      - "pyrift/rules/**"
      - "pyrift/rule_metadata.py"
      - "tools/verify_rule.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify all rules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install pyrift
        run: python -m pip install -e .

      - name: Run verification harness
        run: python tools/verify_rule.py --all --verbose

      - name: Run verification harness (fail-fast smoke test)
        run: python tools/verify_rule.py --all --fail-fast
