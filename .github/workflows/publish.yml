name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Release gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            benchmark/requirements.txt

      - name: Install package and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Install pinned corpus dependencies
        run: python -m pip install -r benchmark/requirements.txt

      - name: Check Ruff
        run: python -m ruff check .

      - name: Compile project
        run: python -m compileall -q pyrift tests benchmark scripts

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Check documentation statistics
        run: python scripts/check_docs.py

      - name: Run golden benchmark
        run: python benchmark/run_benchmark.py

      - name: Run self-scan
        run: python benchmark/self_scan.py

      - name: Run strict corpus benchmark
        env:
          PYRIFT_CORPUS_STRICT: "1"
        run: python benchmark/corpus.py

      - name: Run runtime differential harness
        run: python benchmark/runtime_harness.py

      - name: Validate rule inventory
        run: |
          python -c "
          import pyrift
          from pathlib import Path

          rules = pyrift.ALL_RULES
          readme = Path('README.md').read_text(encoding='utf-8')
          changelog = Path('CHANGELOG.md').read_text(encoding='utf-8')

          version = pyrift.__version__
          total = len(rules)
          cpython = sum(r.runtime == 'cpython' for r in rules)
          pypy = sum(r.runtime == 'pypy' for r in rules)
          both = sum(r.runtime == 'both' for r in rules)

          expected = (
              f'**Rules:** {total} total '
              f'({cpython} CPython + '
              f'{pypy} PyPy + '
              f'{both} cross-runtime)'
          )

          assert expected in readme, (
              f'README rule inventory mismatch: {expected}'
          )

          assert f'## [{version}]' in changelog, (
              f'CHANGELOG missing entry for {version}'
          )

          print(
              f'Rule inventory valid: '
              f'{total} total, '
              f'{cpython} CPython, '
              f'{pypy} PyPy, '
              f'{both} cross-runtime, '
              f'v{version}'
          )
          "

      - name: Build distributions
        run: python -m build

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Upload validated distributions
        uses: actions/upload-artifact@v7
        with:
          name: pyrift-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to PyPI
    needs: gate
    runs-on: ubuntu-latest

    steps:
      - name: Download validated distributions
        uses: actions/download-artifact@v8
        with:
          name: pyrift-distributions
          path: dist

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install publishing tools
        run: python -m pip install twine

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1